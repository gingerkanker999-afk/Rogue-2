name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle 9.2.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.2.0/bin" >> "$GITHUB_PATH"
      - name: Unzip and build
        run: |
          unzip -q "$(ls *.zip | grep -v '^gradle.zip$' | head -1)"
          cd roguelite
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roguelite-jar
          path: |
            roguelite/build/libs/*.jar
            !roguelite/build/libs/*-sources.jar
